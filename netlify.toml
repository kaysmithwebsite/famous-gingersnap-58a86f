# Generated by build.py. Applies when this folder is deployed directly
# (Netlify Drop, or `netlify deploy --dir=dist`).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Targets are checked against the built pages by build.py. They were written
# for the original structure and pointed at /sell/, /buy/ and /properties/,
# which the Real Estate-first restructure removed, so each was a 301 into a 404.
[[redirects]]
  from = "/home-evaluation"
  to = "/real-estate/sell/"
  status = 301

[[redirects]]
  from = "/mortgage-calculator"
  to = "/resources/mortgage-calculator/"
  status = 301

[[redirects]]
  from = "/calculators"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/guides"
  to = "/resources/guides/"
  status = 301

[[redirects]]
  from = "/properties/*"
  to = "/real-estate/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
